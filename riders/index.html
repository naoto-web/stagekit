<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKL 選手DB</title>
<!-- ホーム画面のアプリとして開くための指定（要件§35・③PWA／§39で訂正）。
     🔴**iPhoneは manifest の `start_url`（"./"）で起動する**＝「追加したときのURL」ではない。
        だから `?k=` を付けたまま追加しても**キーは落ちる**。さらにホーム画面アプリは
        Safariと localStorage が別なので、Safariで覚えたキーも届かない。
        ⇒ キーは画面から入れてもらう（`#keygate`／`js/keygate.js`）。
     ⚠️`start_url` を消せば前者は直るが、**Chromeのインストール要件から外れてAndroidが
        「アプリをインストール」を出さなくなる**ので消さない。 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2029">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 🔴`black-translucent` は**画面が時計・電池の下まで広がる**指定＝上のバーと時計が重なっていた
     （2026-09-23 Yの実機）。`black` はOSが status bar の場所を空けてくれる。
     ⚠️保険として CSS 側にも `env(safe-area-inset-top)` の余白を入れてある（効かない版への備え）。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="選手DB">
<link rel="apple-touch-icon" href="icon-180.png?v=20260925-023156">
<link rel="icon" href="icon-192.png?v=20260925-023156">
<link rel="stylesheet" href="css/style.css?v=20260925-023156">
</head>
<body data-view="work">

<!-- ═══════════ 操作ビュー（事務所PC） ═══════════ -->
<div class="app" id="app" data-tab="list">

  <header class="topbar">
    <div class="brand">選手DB</div>
    <nav class="tabs">
      <button type="button" class="tab is-on" data-tab="list">選手一覧</button>
      <button type="button" class="tab" data-tab="today">本日の出走表</button>
    </nav>
    <div class="top-right">
      <!-- 背景の色を切り替える（既定は黒。押すとこのブラウザだけが覚える） -->
      <button type="button" class="btn btn-sm theme-btn" id="theme-btn">○ 白背景にする</button>
      <span class="conn" id="conn" data-ok="wait">接続中…</span>
    </div>
  </header>

  <main class="cols">

    <!-- ── 左：一覧／出走表 ── -->
    <section class="col-left">

      <div class="pane" id="pane-list">
        <div class="filters">
          <input type="search" id="q" placeholder="名前・カナ・登録番号でさがす" autocomplete="off" spellcheck="false">
          <!-- 中身は名簿から作る（list.js renderKyuhanOptions）。使われている級班だけ人数つきで並ぶ。
               ⚠️ここは実データが来るまでの仮の1つ。**list.js の state.kyuhan と同じ値にする**
                  （main.js の初回 load がこのセレクトの値を読むため） -->
          <select id="kyuhan-sel" class="sel" title="級班でしぼりこむ">
            <option value="all">すべての級班</option>
          </select>
        </div>
        <div class="kana-rows" id="kana-rows"></div>
        <div class="list-head"><span id="list-count">—</span></div>
        <div class="list" id="rider-list"></div>
      </div>

      <div class="pane is-hidden" id="pane-today">
        <div class="filters">
          <select id="day-sel" class="sel">
            <option value="0">本日</option>
            <option value="1">明日</option>
          </select>
          <button type="button" class="btn" id="card-reload">取り直す</button>
          <span class="muted" id="card-meta"></span>
        </div>
        <div class="venue-tabs" id="venue-tabs"></div>
        <div class="racecard" id="racecard"></div>
      </div>

    </section>

    <!-- ── 右：選手詳細 ── -->
    <section class="col-right">
      <!-- スマホ（1カラム）でだけ出る戻りバー。§35
           ⚠️`#detail` の外に置く＝detail.js が中身を描き直しても消えない -->
      <div class="m-bar">
        <button type="button" class="m-back" id="m-back">← もどる</button>
      </div>
      <div id="detail">
        <div class="empty">左から選手を選んでください。</div>
      </div>
    </section>

  </main>
</div>

<!-- ═══════════ APIキーの入力（要件§39） ═══════════
     iPhoneのホーム画面アプリは `?k=` を落として起動し、Safariとは保存場所も別
     （head のコメント参照）＝**URL以外にキーを入れる道**が要る。
     ⚠️既定は hidden。出し入れするのは keygate.js だけ（出力ビューからは呼ばれない）。
     ⚠️`#app` の外に置く＝出力ビューは `#app` を remove するが、こちらは元々出さないので無害。 -->
<div class="keygate" id="keygate" hidden>
  <div class="kg-box">
    <div class="kg-title">はじめに1回だけ設定します</div>
    <p class="kg-lead">LINEで送られた<b>URLをそのまま貼り付けて</b>ください。<br>
      長押し →「ペースト」で入ります。</p>
    <input type="text" class="inp kg-inp" id="kg-inp" placeholder="https://…/riders/?k=…"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="button" class="btn btn-primary kg-go" id="kg-go">保存して開く</button>
    <p class="kg-err" id="kg-err" hidden></p>
    <p class="kg-note">この設定はこの端末にだけ残ります。<br>
      URLはパスワードと同じなので、チームの外には出さないでください。</p>
  </div>
</div>

<!-- ═══════════ 出力ビュー（OBSブラウザソース・背景透明） ═══════════ -->
<div class="outcard" id="outcard" hidden></div>

<script src="../autoupdate.js?v=20260925-023156" data-au="output-only"></script>
<script src="js/config.js?v=20260925-023156"></script>
<script src="js/keygate.js?v=20260925-023156"></script>
<script src="js/racetype.js?v=20260925-023156"></script>
<script src="js/bank.js?v=20260925-023156"></script>
<script src="js/api.js?v=20260925-023156"></script>
<script src="js/kana.js?v=20260925-023156"></script>
<script src="js/list.js?v=20260925-023156"></script>
<script src="js/today.js?v=20260925-023156"></script>
<script src="js/detail.js?v=20260925-023156"></script>
<script src="js/output.js?v=20260925-023156"></script>
<script src="js/main.js?v=20260925-023156"></script>
</body>
</html>
