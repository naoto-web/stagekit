<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body class="scene-talk" data-theme="a">

<div class="stage" id="stage">
  <svg id="backdrop" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>

  <!-- ==== 全シーン共通ヘッダー ==== -->
  <header class="gbar">
    <div class="sp-logo"><img src="sponsor_black.png" alt="競輪公式投票CTC"></div>
    <div class="venue-tabs" id="vtabs"></div>
    <div class="clock-box"><span class="clock-date" data-clock-date></span><span class="clock-time" data-clock-time></span></div>
  </header>

  <!-- ================= ①トークシーン ================= -->
  <section class="scene" id="scene-talk">
    <div class="talk-cams">
      <div class="cam slot-a" data-hole><div class="cam-ph">👤</div><div class="nameplate letter"><i class="np-dot"></i><span id="np-talk-a"></span></div></div>
      <div class="cam slot-b" data-hole><div class="cam-ph">👤</div><div class="nameplate letter"><i class="np-dot alt"></i><span id="np-talk-b"></span></div></div>
    </div>

    <!-- 予想帯＝②レース観戦と同じ様式（メンバーカラーヘッダー＋投資/回収・買い目チップ） -->
    <div class="talk-band">
      <div class="panel slot-a">
        <div class="panel-head band-head" id="tband-head-a"><span id="tband-name-a">予想</span><span class="band-inv" id="tband-inv-a"></span></div>
        <div class="buy-line" id="tband-pred-a"></div>
      </div>
      <div class="panel slot-b">
        <div class="panel-head band-head" id="tband-head-b"><span id="tband-name-b">予想</span><span class="band-inv" id="tband-inv-b"></span></div>
        <div class="buy-line" id="tband-pred-b"></div>
      </div>
    </div>

    <aside class="vrail">
      <ul class="timer-cards" id="timer-talk"></ul>
      <div class="panel slist-panel">
        <div class="panel-head">出走表<span class="panel-head-sub" id="slist-sub"></span></div>
        <ul class="slist" id="slist-talk"></ul>
        <div class="narabi-row hidden" id="narabi-talk"></div>
      </div>
    </aside>

    <div class="ticker hidden" id="ticker-talk-wrap"><div class="ticker-inner" id="ticker-talk"></div></div>
  </section>

  <!-- ================= ②レース観戦シーン ================= -->
  <section class="scene" id="scene-race">
    <!-- 場名/Rのバーは置かない：映像は別ウィンドウのキャプチャで、実際に映るレースと
         コンソールの場情報がズレうるため（7/29 FB4）。映像枠は16:9固定 -->
    <div class="video-frame">
      <div class="vf-screen" data-hole><div class="video-ph">レース映像（許諾映像）</div></div>
    </div>

    <div class="race-band">
      <div class="panel slot-a">
        <div class="panel-head band-head" id="band-head-a"><span id="band-name-a">予想</span><span class="band-inv" id="band-inv-a"></span></div>
        <div class="buy-line" id="band-pred-a"></div>
      </div>
      <div class="panel slot-b">
        <div class="panel-head band-head" id="band-head-b"><span id="band-name-b">予想</span><span class="band-inv" id="band-inv-b"></span></div>
        <div class="buy-line" id="band-pred-b"></div>
      </div>
    </div>

    <aside class="vrail race-rail">
      <ul class="timer-cards" id="timer-race"></ul>
      <div class="cam slot-a" data-hole><div class="cam-ph">👤</div><div class="nameplate"><i class="np-dot"></i><span id="np-race-a"></span></div></div>
      <div class="cam slot-b" data-hole><div class="cam-ph">👤</div><div class="nameplate"><i class="np-dot alt"></i><span id="np-race-b"></span></div></div>
    </aside>
  </section>

  <!-- ================= ③結果・的中シーン ================= -->
  <section class="scene" id="scene-result">
    <div class="panel race-chips" id="race-chips"><span class="chips-title">本日の結果</span><span id="race-chips-body"></span></div>

    <div class="panel result-panel">
      <div class="panel-head" id="result-title">レース結果</div>
      <div class="result-rows" id="result-rows"></div>
      <div class="payout-grid" id="payout-grid"></div>
    </div>

    <div class="hit-badge hidden" id="hit-badge"><span class="hit-main" id="hit-main"></span><span class="hit-sub" id="hit-sub"></span></div>

    <div class="cams small-cams">
      <div class="cam slot-a" data-hole><div class="cam-ph">👤</div><div class="nameplate"><i class="np-dot"></i><span id="np-result-a"></span></div></div>
      <div class="cam slot-b" data-hole><div class="cam-ph">👤</div><div class="nameplate"><i class="np-dot alt"></i><span id="np-result-b"></span></div></div>
    </div>

    <div class="ticker" id="ticker"><div class="ticker-inner" id="ticker-result"></div></div>
  </section>

  <!-- ================= ④待機シーン ================= -->
  <section class="scene" id="scene-brb">
    <div class="brb-center">
      <div class="brand big"><span class="brand-mark">OKL</span><span class="brand-sub">競輪LIVE</span></div>
      <div class="brb-msg" id="brb-msg"></div>
      <div class="brb-next" id="brb-next"></div>
      <ul class="brb-list" id="brb-list"></ul>
    </div>
  </section>

  <!-- ================= ⑤広告シーン ================= -->
  <section class="scene" id="scene-ad">
    <div class="panel ad-panel">
      <div class="ad-logo"><img src="sponsor.png" alt="競輪公式投票CTC"></div>
      <div class="ad-title" id="ad-title"></div>
      <ul class="ad-list" id="ad-list"></ul>
      <div class="ad-progress" id="ad-progress">
        <span class="ad-goal" id="ad-goal"></span>
        <div class="ad-bar"><div class="ad-bar-fill" id="ad-bar-fill"></div></div>
        <span class="ad-nums" id="ad-nums"></span>
      </div>
    </div>

    <div class="ad-wipes">
      <div class="cam ad-wipe slot-a" data-hole><div class="cam-ph">👤</div><div class="nameplate"><i class="np-dot"></i><span id="np-ad-a"></span></div></div>
      <div class="cam ad-wipe slot-b" data-hole><div class="cam-ph">👤</div><div class="nameplate"><i class="np-dot alt"></i><span id="np-ad-b"></span></div></div>
    </div>

    <div class="promo-chip">プロモーションを含みます（有料プロモーション設定ON）</div>
  </section>
</div>

<div class="dbg" id="dbg"></div>

<script src="config.js"></script>
<script src="keirin.js"></script>
<script src="derive.js"></script>
<script src="sync.js"></script>
<script src="overlay.js"></script>
</body>
</html>
