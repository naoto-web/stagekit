<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競輪 展開ボード v2</title>
<link rel="stylesheet" href="css/style.css?v=20260927-050933">
</head>
<body>

<div class="app">

  <!-- ===== 操作パネル（OBSのドック側だけ。出力 ?view=output では消える） ===== -->
  <header class="panel" id="panel">

    <div class="panel-row">
      <!-- 場・レースは配信（コンソール）に常時追従するので通常は隠れている。?follow=0 のときだけ現れる -->
      <div class="field manual-only">
        <label for="venue-select">場</label>
        <select id="venue-select" class="sel" disabled></select>
      </div>
      <div class="field manual-only">
        <label for="race-select">レース</label>
        <select id="race-select" class="sel" disabled></select>
      </div>
      <div class="field manual-only">
        <label class="chk" for="follow-chk" title="コンソールが出しているレースに自動で合わせます">
          <input type="checkbox" id="follow-chk" checked>配信に追従
        </label>
        <button type="button" class="diff" id="follow-diff" hidden></button>
      </div>

      <div class="field auto-only">
        <span class="now-race" id="now-race">配信のレースに追従中…</span>
      </div>

      <div class="field field-grow">
        <label for="lineup-input">並び</label>
        <input type="text" id="lineup-input" placeholder="例）1-3-5 / 2-7 / 4-6-9" autocomplete="off" spellcheck="false">
        <button type="button" id="apply-btn" class="btn btn-primary">配置</button>
      </div>

      <div class="field">
        <button type="button" id="reset-btn" class="btn">配置を戻す</button>
        <button type="button" id="reload-btn" class="btn btn-sub">出走表を再取得</button>
      </div>

      <div class="field">
        <label for="size-range">サイズ</label>
        <input type="range" id="size-range" min="40" max="56" step="1">
        <span class="val" id="size-val">4.8%</span>
      </div>

      <div class="field">
        <span class="live-dot" id="live-dot" data-live="off">出力：未接続</span>
      </div>
    </div>

    <!-- 局面ボタン＝先頭がその地点に来るまで全体が進む（戻る）。要件定義_v2 §5・§6.4 -->
    <div class="panel-row panel-row-phase">
      <div class="phase-group">
        <button type="button" class="btn btn-phase" data-phase="start">スタート</button>
        <button type="button" class="btn btn-phase" data-phase="red">赤板</button>
        <button type="button" class="btn btn-phase" data-phase="bell">🔔 打鐘</button>
        <button type="button" class="btn btn-phase" data-phase="home">最終ホーム</button>
        <button type="button" class="btn btn-phase" data-phase="back">バック</button>
        <button type="button" class="btn btn-phase" data-phase="corner4">4角</button>
        <button type="button" class="btn btn-phase" data-phase="straight" title="4角を抜けてホーム直線へ。ここで差し・突き抜け・ズブズブを押すと3着までゴールする">最終ストレート</button>
        <button type="button" class="btn btn-phase" data-phase="goal">ゴール</button>
      </div>
      <div class="phase-group">
        <button type="button" class="btn btn-undo" id="undo-btn" title="Ctrl+Z" disabled>↶ 取り消し</button>
        <button type="button" class="btn btn-undo" id="redo-btn" title="Ctrl+Y" disabled>↷ やり直し</button>
      </div>
    </div>

    <!-- 動詞ボタン（v2.1）＝選手かラインをクリックして選んでから押す。要件定義_v2 §6.5 -->
    <div class="panel-row panel-row-verb">
      <span class="sel-label is-empty" id="sel-label">選択なし（丸かラインをクリック）</span>
      <div class="phase-group">
        <button type="button" class="btn btn-verb" data-verb="joushou" title="選んだラインが外を上がって、先頭ラインの前に入る">上昇</button>
        <button type="button" class="btn btn-verb" data-verb="makuri" title="外を上がって先頭の横まで（ラインの先頭を選ぶと後続も続く）">まくり</button>
        <button type="button" class="btn btn-verb" data-verb="sashi" title="すぐ前の選手を空いている側から交わす">差し</button>
        <button type="button" class="btn btn-verb" data-verb="tsukinuke" title="番手が同じラインの先頭を交わす">突き抜け</button>
        <button type="button" class="btn btn-verb" data-verb="oshikiri" title="先頭がそのままゴールへ（最終周回で）">押切</button>
        <button type="button" class="btn btn-verb" data-verb="block" title="外へ振って、外にいる選手を止める">ブロック</button>
        <button type="button" class="btn btn-verb" data-verb="zubu" title="最終ストレートで：選んだラインがそのまま1-2-3着">ズブズブ</button>
      </div>
      <div class="phase-group">
        <button type="button" class="btn btn-order" data-verb="up" title="選んだラインを1つ前のラインと入れ替える">▲ 順番を前へ</button>
        <button type="button" class="btn btn-order" data-verb="down" title="選んだラインを1つ後ろのラインと入れ替える">▼ 順番を後ろへ</button>
      </div>
      <!-- 3連単で決着（9/27）：最終周回で押すと、その着順でゴールまで走り切る -->
      <div class="field">
        <label for="trifecta-input">3連単</label>
        <input type="text" id="trifecta-input" class="trifecta" placeholder="4-2-7" autocomplete="off" spellcheck="false" maxlength="12">
        <button type="button" id="trifecta-btn" class="btn btn-finish">決着</button>
      </div>
    </div>

    <p class="hint" id="hint">局面ボタンで全体が進みます。<b>盤面の上でホイール（奥へ＝進む／手前へ＝戻す）</b>や → ← キーで少しずつ。<b>丸をドラッグ＝1台</b>（コースに沿って動く・離すと内/中/外にそろう）／<b>ラインの帯をドラッグ＝ライン全員</b>。</p>
  </header>

  <!-- ===== 表示エリア（1枚のSVG・viewBox 960×572。縦横比を保って窓に合わせる） ===== -->
  <main class="stage-wrap">
    <div class="stage" id="stage" data-bg="normal"></div>
  </main>

</div>

<script src="js/lineup.js?v=20260927-050933"></script>
<script src="js/anim.js?v=20260927-050933"></script>

<script src="js/verbs.js?v=20260927-050933"></script>

</body>
</html>
